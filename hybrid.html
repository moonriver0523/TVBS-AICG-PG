<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>混合版型原型 — AI 背景 × APP 資訊層</title>
<style>
  :root {
    --bg: #0d1424; --panel: #141d33; --border: #26314d;
    --text: #e8ecf5; --muted: #8a94ad; --accent: #ffc843;
    /* 全站 UI 縮放，與 index.html 同一套做法（見那邊的註解） */
    --ui-scale: 1.1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    zoom: var(--ui-scale);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    background: var(--bg); color: var(--text);
    min-height: calc(100vh / var(--ui-scale));
  }
  header {
    padding: 14px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 14px;
  }
  header h1 { font-size: 18px; }
  header .tag { font-size: 12px; color: var(--muted); }
  header a { color: var(--muted); font-size: 13px; margin-left: auto; }
  .layout { display: flex; gap: 20px; padding: 20px 24px; align-items: flex-start; }
  .controls { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .card h2 { font-size: 13px; color: var(--accent); margin-bottom: 10px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 3px; }
  input[type=text], textarea, select {
    width: 100%; background: #0b1120; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; font-size: 13px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 56px; }
  .item-row { display: grid; grid-template-columns: 1fr 1.2fr 1fr 62px; gap: 6px; margin-bottom: 6px; }
  .item-row input, .item-row select { padding: 6px 7px; font-size: 12px; }
  button {
    width: 100%; padding: 10px; border: none; border-radius: 8px; font-size: 14px;
    font-family: inherit; font-weight: bold; cursor: pointer; margin-top: 8px;
  }
  #btnAuto { background: linear-gradient(135deg, #ff7a3d, #ff3d77); color: #fff; }
  #btnBg { background: linear-gradient(135deg, #3d6bff, #7a3dff); color: #fff; }
  #btnExport { background: var(--accent); color: #1a1a1a; }
  button:disabled { opacity: .45; cursor: wait; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row label { margin: 0; }
  #status { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 16px; }
  .preview-wrap { flex: 1; min-width: 0; }
  #svgHost { width: 100%; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #000; }
  #svgHost svg { display: block; width: 100%; height: auto; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .palette { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .palette label {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin: 0; font-size: 12px;
  }
  .palette input[type=color] {
    width: 40px; height: 26px; flex-shrink: 0; padding: 0; cursor: pointer;
    background: #0b1120; border: 1px solid var(--border); border-radius: 5px;
  }
  #btnPaletteReset { background: transparent; border: 1px solid var(--border); color: var(--muted); font-size: 12px; padding: 7px; }
</style>
</head>
<body>
<header>
  <h1>混合版型原型</h1>
  <span class="tag">階段0 技術驗證 — AI 生背景，APP 疊資訊 · 1280×720</span>
  <a href="index.html">← 回主工具</a>
</header>
<div class="layout">
  <aside class="controls">
    <div class="card">
      <h2>AI 一鍵成圖（記者外勤模式）</h2>
      <label>貼上新聞原文</label>
      <textarea id="f-news" style="min-height:96px" placeholder="貼新聞文字後按下方按鈕：AI 自動消化 → 填入卡片 → 生成背景 → 自動下載 PNG。完成後仍可手動微調再匯出。"></textarea>
      <button id="btnAuto">AI 一鍵成圖</button>
    </div>
    <div class="card">
      <h2>內容（APP 繪製，保證正確）</h2>
      <label>主標題</label>
      <input type="text" id="f-title" value="美股三大指數收黑">
      <label>標題重點詞（上色，AI 會自動帶）</label>
      <input type="text" id="f-title-key" value="收黑" placeholder="須為主標題裡的字；留空＝整條白字">
      <label>次標題</label>
      <input type="text" id="f-subtitle" value="7月22日收盤">
      <label>三欄數據（名稱／數值／漲跌／方向）</label>
      <div id="items"></div>
      <label>資料來源</label>
      <input type="text" id="f-source" value="資料來源：Reuters">
    </div>
    <div class="card">
      <h2>文字顏色（會記住設定）</h2>
      <div class="palette">
        <label>標題<input type="color" id="c-base"></label>
        <label>重點詞<input type="color" id="c-key"></label>
        <label>次標題<input type="color" id="c-sub"></label>
        <label>項目名<input type="color" id="c-noun"></label>
        <label>數值<input type="color" id="c-value"></label>
        <label>持平<input type="color" id="c-flat"></label>
        <label>漲<input type="color" id="c-up"></label>
        <label>跌<input type="color" id="c-down"></label>
      </div>
      <button id="btnPaletteReset">還原預設配色</button>
    </div>
    <div class="card">
      <h2>AI 背景（僅視覺，禁文字）</h2>
      <label>視覺主題描述</label>
      <textarea id="f-visual">紐約證交所交易大廳，下跌的金融市場氣氛，深藍色調，微弱紅色下行光影</textarea>
      <div class="row" style="margin-top:8px">
        <select id="f-provider" style="flex:1">
          <option value="gpt">GPT</option>
          <option value="gemini">Gemini</option>
        </select>
        <label class="row" style="gap:4px; font-size:12px; color:var(--muted)">
          <input type="checkbox" id="f-guides"> 安全區
        </label>
      </div>
      <button id="btnBg">生成 AI 背景</button>
      <button id="btnExport">匯出 PNG（1280×720）</button>
      <div id="status"></div>
    </div>
    <div class="hint">
      流程：改內容 → 即時預覽 → 生成背景 → 匯出。<br>
      重新生成背景不會動到已填的文字與數字。
    </div>
  </aside>
  <main class="preview-wrap">
    <div id="svgHost"></div>
  </main>
</div>
<script src="hybrid.js"></script>
<script>initHybrid();</script>
</body>
</html>
